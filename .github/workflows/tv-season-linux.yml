name: 剧集整理Linux版
on:
  push:
    paths:
      - 'emby-tools/tv-season-linux/**'
      - '.github/workflows/tv-season-linux.yml'
  pull_request:
    paths:
      - 'emby-tools/tv-season-linux/**'
      - '.github/workflows/tv-season-linux.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: emby-tools/tv-season-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: emby-tools/tv-season-linux/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npm run test:upstream
      - run: bash -n install.sh && bash -n manage.sh && bash -n test/manager-smoke.sh && bash -n test/runtime-selection.sh
      - run: bash test/runtime-selection.sh
      - run: python3 test/terminal-smoke.py
      - run: git diff --exit-code -- lib/generated
      - name: root安装卸载与保留Node
        if: matrix.os == 'ubuntu-24.04' && matrix.node == 22
        run: sudo env GITHUB_ACTIONS=true bash test/manager-smoke.sh "$(command -v node)" "$PWD"
