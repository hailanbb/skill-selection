name: Douyin Xiaohongshu Obsidian Note

on:
  pull_request:
    paths:
      - "skills/douyin-xiaohongshu-obsidian-note/**"
      - ".github/workflows/douyin-xiaohongshu-obsidian-note.yml"
      - "skills/douyin-obsidian-note/**"
  push:
    branches:
      - master
    paths:
      - "skills/douyin-xiaohongshu-obsidian-note/**"
      - ".github/workflows/douyin-xiaohongshu-obsidian-note.yml"
      - "skills/douyin-obsidian-note/**"

permissions:
  contents: read

jobs:
  portable-python:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r skills/douyin-xiaohongshu-obsidian-note/requirements-dev.txt
      - name: Run offline workflow and packaging tests
        run: python -X utf8 -m unittest discover -s skills/douyin-xiaohongshu-obsidian-note/tests -v
