name: Obsidian Wiki validation
on:
  push:
    paths:
      - 'skills/obsidian-整理/**'
      - '.github/workflows/obsidian-wiki.yml'
  pull_request:
    paths:
      - 'skills/obsidian-整理/**'
      - '.github/workflows/obsidian-wiki.yml'
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r "skills/obsidian-整理/requirements.txt"
      - run: python -X utf8 -m unittest discover -s "skills/obsidian-整理/tests" -v
