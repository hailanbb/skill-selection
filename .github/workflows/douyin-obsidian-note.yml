name: Douyin Obsidian Note

on:
  pull_request:
    paths:
      - "skills/douyin-obsidian-note/**"
      - ".github/workflows/douyin-obsidian-note.yml"
  push:
    branches:
      - master
    paths:
      - "skills/douyin-obsidian-note/**"
      - ".github/workflows/douyin-obsidian-note.yml"

permissions:
  contents: read

jobs:
  portable-python:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.10"
          - "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run metadata regression tests
        run: python -m unittest discover -s skills/douyin-obsidian-note/tests -v
      - name: Check command entry points
        shell: bash
        run: |
          python skills/douyin-obsidian-note/scripts/configure.py --help >/dev/null
          python skills/douyin-obsidian-note/scripts/run_workspace.py --help >/dev/null
          python skills/douyin-obsidian-note/scripts/extract_metadata.py --help >/dev/null
          python skills/douyin-obsidian-note/scripts/extract_keyframes.py --help >/dev/null
          python skills/douyin-obsidian-note/scripts/publish_note.py --help >/dev/null
          python skills/douyin-obsidian-note/scripts/validate_note.py --help >/dev/null
